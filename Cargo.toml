[package]
name = "novel-downloader"
version = "0.1.0"
edition = "2021"
description = "Multi-site web novel search and download library (83+ sites supported)"
license = "MIT"
repository = "https://github.com/tokimo-lab/tokimo-package-novel-downloader"
homepage = "https://github.com/tokimo-lab/tokimo-package-novel-downloader"
keywords = ["novel", "download", "scraper", "web", "search"]
categories = ["text-processing"]

[lib]
name = "novel_downloader"
path = "src/lib.rs"

[dependencies]
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
encoding_rs = "0.8"
regex = "1"
futures = "0.3"
once_cell = "1"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
