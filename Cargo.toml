[package]
name = "novel-downloader"
version = "0.1.0"
edition = "2021"

[lib]
name = "novel_downloader"
path = "src/lib.rs"

[[bin]]
name = "novel-downloader"
path = "src/main.rs"

[dependencies]
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
encoding_rs = "0.8"
regex = "1"
dialoguer = "0.11"
indicatif = "0.17"
futures = "0.3"
once_cell = "1"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
